<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="OpenOrbit: Small, open-source tools for developers and creators.">
<defs><style>@font-face{font-family:GP;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:GS;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:GM;src:url(data:font/woff2;base64,) format("woff2")}
.pt{font:400 15px GM,monospace;fill:#e6edf3}
.name{font:400 112px GP,monospace;fill:#e6edf3}
.tag{font:400 24px GS,sans-serif;fill:#9198a1}
.ol{font:400 14px GM,monospace;fill:#7d8590}
.ring{fill:none;stroke:rgba(240,246,252,.14);stroke-width:1.2}
.spin1{animation:spin 18s linear infinite;transform-origin:1220px 200px}
.spin2{animation:spin 30s linear infinite reverse;transform-origin:1220px 200px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin1,.spin2{animation:none}}
</style>
<pattern id="g" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="rgba(240,246,252,.06)"/></pattern>
<radialGradient id="fade" cx="1220" cy="200" r="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></radialGradient>
<mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="400"><rect width="1600" height="400" fill="url(#fade)"/></mask>
</defs>
<rect width="1600" height="400" fill="url(#g)" mask="url(#m)"/>
<rect x="56" y="58" width="248" height="36" rx="18" fill="none" stroke="rgba(240,246,252,.14)"/>
<text x="72" y="81" class="pt">github.com/OpenOrbitLabs</text>
<text x="52" y="236" class="name">OpenOrbit.</text>
<text x="56" y="296" class="tag">Small, open-source tools for developers and creators.</text>
<circle cx="1220" cy="200" r="74" class="ring"/>
<circle cx="1220" cy="200" r="138" class="ring"/>
<circle cx="1220" cy="200" r="10" fill="#e6edf3"/>
<g class="spin1"><circle cx="1294" cy="200" r="6" fill="#e6edf3"/><text x="1308" y="205" class="ol">Vedit</text></g>
<g class="spin2"><circle cx="1082" cy="200" r="6" fill="#e6edf3"/><text x="1068" y="205" text-anchor="end" class="ol">CommitGen</text></g>
</svg>